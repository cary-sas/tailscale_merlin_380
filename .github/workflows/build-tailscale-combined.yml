name: Build & Commit Tailscale (ARMv5 combined + UPX 3.94)

on:
  schedule:
    - cron: "5 4 * * 6"

  workflow_dispatch:
    inputs:
      ts_version:
        description: "Optional Tailscale tag, e.g. v1.102.3. Leave empty for latest stable."
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: arm
      GOARM: "5"
      LDFLAGS: "-s -w -buildid="

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          set -euo pipefail

          sudo apt-get update -y
          sudo apt-get install -y \
            curl \
            xz-utils \
            jq \
            build-essential \
            ca-certificates \
            file

      - name: Set up latest stable Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Resolve Tailscale version
        id: resolve
        env:
          INPUT_TS_VERSION: "${{ inputs.ts_version }}"
        run: |
          set -euo pipefail

          if [ -n "${INPUT_TS_VERSION}" ]; then
            TAG="${INPUT_TS_VERSION}"
          else
            TAG="$(
              curl -fsSL \
                "https://api.github.com/repos/tailscale/tailscale/releases/latest" |
                jq -r '.tag_name'
            )"
          fi

          if [ -z "${TAG}" ] || [ "${TAG}" = "null" ]; then
            echo "Failed to resolve the Tailscale version."
            exit 1
          fi

          case "${TAG}" in
            v*) ;;
            *) TAG="v${TAG}" ;;
          esac

          VER="${TAG#v}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"

          echo "Resolved tag: ${TAG}"
          echo "Output directory: binary/${VER}"

      - name: Check whether version already exists
        id: guard
        env:
          TS_VERSION: "${{ steps.resolve.outputs.ver }}"
        run: |
          set -euo pipefail

          if [ -f "binary/${TS_VERSION}/tailscale.combined" ]; then
            echo "Tailscale ${TS_VERSION} already exists."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tailscale ${TS_VERSION} will be built."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install UPX 3.94
        if: steps.guard.outputs.skip == 'false'
        run: |
          set -euo pipefail

          curl -fsSL \
            "https://github.com/upx/upx/releases/download/v3.94/upx-3.94-amd64_linux.tar.xz" \
            -o upx.tar.xz

          tar -xJf upx.tar.xz

          sudo install -m 0755 \
            upx-3.94-amd64_linux/upx \
            /usr/local/bin/upx

          sudo ln -sf \
            /usr/local/bin/upx \
            /usr/local/bin/upx-ucl

          upx-ucl -V

      - name: Download Tailscale source
        if: steps.guard.outputs.skip == 'false'
        env:
          TS_TAG: "${{ steps.resolve.outputs.tag }}"
          TS_VERSION: "${{ steps.resolve.outputs.ver }}"
        run: |
          set -euo pipefail

          ARCHIVE="tailscale-${TS_TAG}.tar.gz"
          SRC_DIR="tailscale-${TS_VERSION}"

          curl -fsSL \
            "https://github.com/tailscale/tailscale/archive/refs/tags/${TS_TAG}.tar.gz" \
            -o "${ARCHIVE}"

          tar -xzf "${ARCHIVE}"

          if [ ! -d "${SRC_DIR}" ]; then
            echo "Expected source directory does not exist: ${SRC_DIR}"
            exit 1
          fi

          echo "SRC_DIR=${SRC_DIR}" >> "$GITHUB_ENV"
          echo "Source directory: ${SRC_DIR}"

      - name: Generate minimal router build tags
        if: steps.guard.outputs.skip == 'false'
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail

          FEATURE_TAGS="$(
            env -u GOOS -u GOARCH -u GOARM \
              go run ./cmd/featuretags \
                --min \
                --add=osrouter,advertiseroutes,advertiseexitnode,ipnbus,iptables,dns,portmapper
          )"

          if [ -z "${FEATURE_TAGS}" ]; then
            echo "Failed to generate Tailscale feature tags."
            exit 1
          fi

          BUILD_TAGS="ts_include_cli,${FEATURE_TAGS}"
          echo "BUILD_TAGS=${BUILD_TAGS}" >> "$GITHUB_ENV"

          echo "Generated build tags:"
          echo "${BUILD_TAGS}" | tr ',' '\n'

      - name: Build ARMv5 combined binary
        if: steps.guard.outputs.skip == 'false'
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euxo pipefail

          go version
          go env GOOS GOARCH GOARM CGO_ENABLED

          go build \
            -trimpath \
            -buildvcs=false \
            -tags "${BUILD_TAGS}" \
            -ldflags "${LDFLAGS}" \
            -o tailscale.combined \
            ./cmd/tailscaled

          file tailscale.combined
          ls -lh tailscale.combined

          BEFORE_SIZE="$(stat -c '%s' tailscale.combined)"
          echo "Size before UPX: ${BEFORE_SIZE} bytes"

      - name: Compress binary with UPX 3.94
        if: steps.guard.outputs.skip == 'false'
        working-directory: ${{ env.SRC_DIR }}
        run: |
          set -euo pipefail

          BEFORE_SIZE="$(stat -c '%s' tailscale.combined)"

          if upx-ucl --lzma --ultra-brute tailscale.combined; then
            echo "UPX compression completed."

            if ! upx-ucl -t tailscale.combined; then
              echo "UPX integrity test failed."
              exit 1
            fi
          else
            echo "UPX compression failed; keeping the original binary."
          fi

          AFTER_SIZE="$(stat -c '%s' tailscale.combined)"

          echo "Size before UPX: ${BEFORE_SIZE} bytes"
          echo "Size after UPX:  ${AFTER_SIZE} bytes"

          file tailscale.combined
          ls -lh tailscale.combined

      - name: Move binary to version directory
        if: steps.guard.outputs.skip == 'false'
        working-directory: ${{ env.SRC_DIR }}
        env:
          TS_VERSION: "${{ steps.resolve.outputs.ver }}"
        run: |
          set -euo pipefail

          FINAL_DIR="../binary/${TS_VERSION}"

          mkdir -p "${FINAL_DIR}"
          mv tailscale.combined "${FINAL_DIR}/tailscale.combined"

          file "${FINAL_DIR}/tailscale.combined"
          ls -lh "${FINAL_DIR}"

      - name: Commit and push
        if: steps.guard.outputs.skip == 'false'
        env:
          TS_VERSION: "${{ steps.resolve.outputs.ver }}"
        run: |
          set -euo pipefail

          BINARY_PATH="binary/${TS_VERSION}/tailscale.combined"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${BINARY_PATH}"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "${TS_VERSION}"
          git push
